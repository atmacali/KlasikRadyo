<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetroRadyo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101216;color:#f5f7fa;font:16px system-ui}main{max-width:520px;margin:auto;padding:24px;min-height:100vh}
small,.muted{color:#9da7b3}.clock{text-align:center;font-size:54px;font-weight:300;margin:16px 0}.center{text-align:center}
button{border:0;border-radius:12px;background:#29313c;color:white;padding:13px 16px;margin:4px;font-size:15px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #39414b;background:#191d23;color:white;margin:5px 0}
.card{display:flex;align-items:center;gap:10px;background:#191d23;border-radius:12px;padding:12px;margin:8px 0}.name{flex:1}.logo{width:42px;height:42px;border-radius:50%;background:#303b49;display:grid;place-items:center}
</style><main><div class="center muted">RETRO RADYO</div><div id="clock" class="clock">--:--</div><div id="status" class="center muted">Bir istasyon seç</div><div class="center" style="margin:16px"><button id="toggle">▶ ÇAL</button><button id="stop">■ DURDUR</button></div><h3>İstasyonlar</h3><div id="stations"></div><h3>İstasyon ekle</h3><input id="name" placeholder="İstasyon adı"><input id="url" placeholder="Yayın URL'si (https://...)"><button id="add">＋ EKLE</button><p class="muted" style="font-size:12px">Reklamsız arayüz prototipi. Yayınların kendi reklamları olabilir. Tarayıcı arka planda ses çalmayı kısıtlayabilir.</p><audio id="audio"></audio></main>
<script>
const defaults=[["SomaFM Groove Salad","https://ice.somafm.com/groovesalad"],["SomaFM Secret Agent","https://ice.somafm.com/secretagent"],["SomaFM Drone Zone","https://ice.somafm.com/dronezone"]];
let stations=JSON.parse(localStorage.getItem("rr-stations")||"null")||defaults.map(([name,url])=>({name,url,fav:false}));let selected=-1;
const audio=document.querySelector("#audio"),status=document.querySelector("#status"),toggle=document.querySelector("#toggle");
function clock(){document.querySelector("#clock").textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}clock();setInterval(clock,1000);
function render(){document.querySelector("#stations").innerHTML="";stations.forEach((s,i)=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<div class="logo">♫</div><div class="name">${esc(s.name)}</div><button>${s.fav?"★":"☆"}</button><button>▶</button>`;let bs=d.querySelectorAll("button");bs[0].onclick=()=>{s.fav=!s.fav;save();render()};bs[1].onclick=()=>play(i);document.querySelector("#stations").append(d)})}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem("rr-stations",JSON.stringify(stations))}
function play(i){selected=i;audio.src=stations[i].url;status.textContent="Bağlanıyor: "+stations[i].name;audio.play().then(()=>{status.textContent="Şimdi çalıyor: "+stations[i].name;toggle.textContent="Ⅱ DURAKLAT"}).catch(()=>status.textContent="Yayın açılamadı; URL'yi kontrol edin");}
toggle.onclick=()=>{if(audio.paused){if(selected<0&&stations.length)play(0);else audio.play().then(()=>toggle.textContent="Ⅱ DURAKLAT")}else{audio.pause();toggle.textContent="▶ ÇAL"}};
document.querySelector("#stop").onclick=()=>{audio.pause();audio.removeAttribute("src");audio.load();toggle.textContent="▶ ÇAL";status.textContent="Durduruldu"};
document.querySelector("#add").onclick=()=>{let name=document.querySelector("#name").value.trim(),url=document.querySelector("#url").value.trim();if(!name||!/^https?:\/\//i.test(url)){alert("İstasyon adı ve http(s) yayın adresi girin.");return}stations.push({name,url,fav:false});save();render();document.querySelector("#name").value="";document.querySelector("#url").value=""};
render();
</script></html>
