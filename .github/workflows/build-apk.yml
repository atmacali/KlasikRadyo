name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - atmacali-patch-1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Build APK with the repository's stable test key
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The phone app reads the newest release; its tag must stay "build-<versionCode>",
      # and versionCode must match app/build.gradle.kts (GITHUB_RUN_NUMBER + 2).
      - name: Publish APK to GitHub Release
        if: github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((GITHUB_RUN_NUMBER + 2))
          TAG="build-${CODE}"
          APK="RetroRadyo-${CODE}.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "RetroRadyo build ${CODE}" \
              --notes "Automatic build from commit ${GITHUB_SHA}" \
              --latest
          fi
